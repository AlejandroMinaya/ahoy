[package]
name = "ahoy"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
cli-log = "2.1.0"
crossterm = "0.29.0"
env_logger = "0.11.8"
log = "0.4.28"
pollster = "0.4.0"
ratatui = "0.29.0"
wgpu = "26.0.1"
winit = { version = "0.30.12", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.depedencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "27.0.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element"
]}


[lib]
crate-type = ["cdylib", "rlib"]

